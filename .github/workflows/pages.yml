name: Pages

# Publishes site/ to GitHub Pages.
#
# This exists because branch-deploy cannot do it. "Deploy from a branch" offers exactly two
# source folders — / (root) and /docs — so a site living in /site is not reachable that way
# at all. The alternatives were to move the directory to docs/ or to name it in a workflow;
# naming it here keeps the directory called what it is.
#
# Set Settings → Pages → Source to "GitHub Actions" once. After that this runs on every push
# to main that touches the site, and can be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Stage exactly what gets published
        # Copy the two files that are the site rather than uploading the directory. The
        # directory also holds README.md, which upload-pages-artifact would happily serve
        # at /README.md; staging makes the published surface explicit instead of "whatever
        # happens to be in the folder".
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html site/styles.css _site/
          ls -la _site/

      - name: Verify the site is self-contained
        # The page tells its readers it loads no fonts, no scripts and no third-party
        # assets. This enforces that rather than trusting it. Runs against the staged copy,
        # so it checks precisely what will be published.
        run: python3 Scripts/check-selfcontained.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
